<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" class="palm-map">
  <!--
    掌面八卦の簡易参照図。
    実物の意匠(掌の輪郭・扇形の角度)は概略であり、そのまま印刷用に
    使うのではなく、レイアウトの土台として調整してください。
    各ゾーンに data-key / data-option を振ってあるので、app.js側で
    document.querySelectorAll('[data-key]') にクリックイベントを
    バインドし、data/palmistry.js の options[id] を検索して
    結果パネルに表示する想定です。
  -->

  <!-- 手首〜掌の輪郭(ざっくりとした土台) -->
  <path d="M60,500 L60,300 C60,180 100,120 200,110 C300,120 340,180 340,300 L340,500 Z"
        fill="var(--palm-fill, #f3e6d8)" stroke="var(--palm-stroke, #7a5c3e)" stroke-width="2"/>

  <!-- 指(親指以外の4本 + 親指) -->
  <g class="fingers">
    <rect data-key="little_finger_traits" x="70"  y="30" width="28" height="90" rx="14"
          class="finger" />
    <rect data-key="ring_finger_traits"   x="115" y="10" width="30" height="115" rx="15"
          class="finger" />
    <rect data-key="middle_finger_traits" x="165" y="0"  width="32" height="130" rx="16"
          class="finger" />
    <rect data-key="index_finger_length"  x="215" y="15" width="30" height="105" rx="15"
          class="finger" />
    <rect data-key="thumb_length" data-group="thumb"
          x="270" y="90" width="34" height="95" rx="17"
          transform="rotate(35 287 137)"
          class="finger thumb" />
  </g>

  <!-- 明堂(中心) -->
  <circle data-key="palm_bagua_zones" data-option="meido"
          cx="200" cy="330" r="34" class="zone zone-center" />

  <!-- 八卦の8ゾーン(明堂を囲む扇形の簡易近似。要調整) -->
  <path data-key="palm_bagua_zones" data-option="rikyu"
        d="M200,296 L170,215 A140,140 0 0,1 230,215 Z" class="zone" />
  <path data-key="palm_bagua_zones" data-option="sonkyu"
        d="M234,300 L296,240 A140,140 0 0,1 260,320 Z" class="zone" />
  <path data-key="palm_bagua_zones" data-option="dakyu"
        d="M234,360 L310,400 A140,140 0 0,1 260,340 Z" class="zone" />
  <path data-key="palm_bagua_zones" data-option="kenkyu"
        d="M200,364 L230,460 A140,140 0 0,1 170,460 Z" class="zone" />
  <path data-key="palm_bagua_zones" data-option="konkyu2"
        d="M166,360 L90,400 A140,140 0 0,1 140,340 Z" class="zone" />
  <path data-key="palm_bagua_zones" data-option="gonkyu"
        d="M166,300 L104,240 A140,140 0 0,1 140,320 Z" class="zone" />
  <path data-key="palm_bagua_zones" data-option="shinkyu"
        d="M172,300 L145,225 A140,140 0 0,1 200,296 Z" class="zone" />
  <path data-key="palm_bagua_zones" data-option="konkyu"
        d="M228,300 L255,225 A140,140 0 0,1 200,296 Z" class="zone" />

  <!-- ラベル(視認用。実装ではCSSでフォントサイズ等を調整) -->
  <g class="zone-labels" font-size="12" fill="var(--palm-label, #4a3826)" text-anchor="middle">
    <text x="200" y="330">明堂</text>
    <text x="200" y="230">離宮</text>
    <text x="270" y="270">巽宮</text>
    <text x="280" y="390">兌宮</text>
    <text x="200" y="440">乾宮</text>
    <text x="120" y="390">坎宮</text>
    <text x="130" y="270">艮宮</text>
    <text x="170" y="255">震宮</text>
    <text x="230" y="255">坤宮</text>
  </g>
</svg>
